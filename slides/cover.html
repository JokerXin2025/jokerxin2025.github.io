<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封面</title>
    <link rel="stylesheet" href="./common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }

        .slide {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fafbfc;
            color: #1a1a2e;
            position: relative; overflow: hidden;
        }

        .content { text-align: center; max-width: 75%; }

        .tag { font-size: 1vw; color: #6b7280; letter-spacing: 2px; margin-bottom: 4vh; }

        .content h1 {
            font-size: 4.5vw; font-weight: 700; letter-spacing: 1px;
            line-height: 1.3; margin-bottom: 2.5vh;
            color: #111827;
        }

        .content .subtitle {
            font-size: 1.5vw; font-weight: 400;
            color: #6b7280; margin-bottom: 6vh;
        }

        .divider { width: 60px; height: 0px; background: #2563eb; margin: 20vh auto; }

        .author { font-size: 1.5vw; color: #9ca3af; }
        .author strong { color: #374151; font-weight: 600; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="content">
            <div class="tag">从形式化证明到自然语言教学</div>
            <h1>微积分形式化库 Calculus_21<br>与形式化辅助教学系统</h1>
            <div class="divider"></div>
            <p class="subtitle"></p>
            <p class="author"><strong>周可信&emsp;华东理工大学</strong></p>
        </div>
    </div>
</body>
</html>

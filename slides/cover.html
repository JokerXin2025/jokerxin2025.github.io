<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./common.css">
    <style>
        .slide {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fafbfc;
            color: #1a1a2e;
            position: relative; overflow: hidden;
        }
        .content { text-align: center; max-width: 75%; }
        .tag { font-size: 1.5vw; color: #6b7280; letter-spacing: 0.1042vw; margin-bottom: 4vh; }
        .content h1 {
            font-size: 4.5vw; font-weight: 700; letter-spacing: 0.0521vw;
            line-height: 1.3; margin-bottom: 20vh;
            color: #111827;
        }
        .author {
            font-size: 1.5vw;
            font-weight: 600;
            color: #374151;
        }
        .site-link {
            position: absolute;
            top: 1.5vh; left: 2vw;
            font-size: 1vw;
            letter-spacing: 0.026vw;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="site-link">www.mitar.top</div>
        <div class="content">
            <div class="tag">从形式化证明到自然语言教学</div>
            <h1>微积分形式化库 Calculus_21<br>与形式化辅助教学系统</h1>
            <p class="author">周可信&emsp;华东理工大学</p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目录</title>
    <link rel="stylesheet" href="./common.css">
    <style>
        .slide {
            flex-direction: row;
            align-items: center;
            padding: 6vh 7vw;
        }

        .left {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .left h1 { font-size: 3.8vw; font-weight: 700; color: #111827; }

        .right {
            flex: 1;
            display: flex; flex-direction: column; gap: 1.6vh;
        }

        .toc-item {
            display: flex; align-items: baseline; gap: 2vw;
            padding: 1vh 0;
            transition: all 0.2s ease;
            cursor: default;
        }
        .toc-item:hover { background: rgba(37,99,235,0.03); padding-left: 0.5vw; }
        .toc-item .num { font-size: 1.5vw; font-weight: 700; color: #2563eb; min-width: 2.5vw; }
        .toc-item .text { font-size: 1.4vw; font-weight: 500; color: #374151; }

        .toc-item.star .num { color: #d97706; }
        .toc-item.star .text { color: #92400e; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="left">
            <h1>目录</h1>
        </div>
        <div class="right">
            <div class="toc-item"><span class="num">01</span><span class="text">背景与动机</span></div>
            <div class="toc-item star"><span class="num">02</span><span class="text">形式化辅助教学系统构想</span></div>
            <div class="toc-item"><span class="num">03</span><span class="text">Calculus_21 —— 教学系统的知识库原型</span></div>
            <div class="toc-item"><span class="num">04</span><span class="text">一般策略 vs 定制策略</span></div>
            <div class="toc-item"><span class="num">05</span><span class="text">自然语言表述引擎 Lean2TeX</span></div>
            <div class="toc-item"><span class="num">06</span><span class="text">证明可视化工具 Mitar</span></div>
            <div class="toc-item"><span class="num">07</span><span class="text">总结与展望</span></div>
        </div>
    </div>
</body>
</html>

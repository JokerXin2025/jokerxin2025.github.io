name = "Calculus_21"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["«Calculus_21»"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# [[require]]
# name = "Lean2TeX"
# path = "/Users/zhoukexin/.Mitar/Lean2TeX"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "«Calculus_21»"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示文稿</title>
    <link rel="stylesheet" href="./slides.css">
</head>
<body>

    <!-- 幻灯片显示区域 -->
    <iframe id="slide-frame" src="" frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen></iframe>

    <!-- 幻灯片计数器 -->
    <div id="slide-counter" class="slide-counter"></div>

    <!-- 上一页按钮 -->
    <button id="btn-prev" class="nav-btn nav-btn-prev" title="上一页 (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <!-- 下一页按钮 -->
    <button id="btn-next" class="nav-btn nav-btn-next" title="下一页 (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>

    <!-- 全屏按钮 -->
    <button id="btn-fullscreen" class="nav-btn nav-btn-fullscreen" title="全屏 (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
    </button>

    <script src="./js/slides-config.js"></script>
    <script src="./js/slides.js"></script>
</body>
</html>
